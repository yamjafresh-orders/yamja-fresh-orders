<script>
    const prices = {
        'Broiler Curry Cut (1kg)': 290,
        'Chicken Wings (500g)': 170,
        'Chicken Breast (500g)': 220,
        'Chicken Boneless (500g)': 250,
        'Chicken Drumstick (500g)': 190,
        'Skinless Chicken (1kg)': 310,
        'Local Chicken (1.2kg Bird)': 660,
        'Local Chicken (1.3kg Bird)': 715,
        'Local Chicken (1.5kg Bird)': 825,
        'Fresh Duck (2kg Bird)': 1200,
        'Fresh Duck (2.5kg Bird)': 1500,
        'Fresh Duck (3kg Bird)': 1800,
        'Farm Fresh Eggs (Tray of 30)': 420,
        'Farm Fresh Eggs (12 pcs)': 180,
        'Farm Fresh Eggs (6 pcs)': 90,
        'Farm Fresh Eggs (4 pcs)': 60
    };

    let cart = {};
    const STORE_UPI_ID = "yamjafresh@upi"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRIAjEqxH946SexL0qI1RuO2Wfs1Etde85j6our5fMlxjlWLsVO3QRRabUpguYnv8L1Q/exec";

    window.onload = function() {
        for (let item in prices) {
            let priceEl = document.getElementById(`price-${item}`);
            if (priceEl) {
                priceEl.innerText = prices[item];
            }
        }
        updateCartDisplay();
        togglePaymentDetails();
    };

    function switchCategory(category, btn) {
        document.querySelectorAll('.category-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(`section-${category}`).classList.add('active');
        btn.classList.add('active');
    }

    function toggleCart() {
        let summary = document.getElementById('cart-container');
        let btnText = document.getElementById('toggle-text-btn');
        summary.classList.toggle('expanded');
        if (summary.classList.contains('expanded')) {
            btnText.innerText = 'Close ⬇';
        } else {
            btnText.innerText = 'View Cart ⬆';
        }
    }

    function togglePaymentDetails() {
        let method = document.getElementById('payment-method').value;
        let upiBox = document.getElementById('upi-box');
        let whatsappBtn = document.getElementById('whatsapp-btn');

        if (method === 'upi') {
            upiBox.classList.add('active');
            whatsappBtn.classList.remove('active');
        } else {
            upiBox.classList.remove('active');
            whatsappBtn.classList.add('active');
        }
    }

    function calculateTotals() {
        let subtotal = 0;
        for (let item in cart) {
            if (cart[item] && cart[item].qty > 0) {
                subtotal += cart[item].qty * prices[item];
            }
        }
        let deliveryCharge = (subtotal >= 1500 || subtotal === 0) ? 0 : 40;
        if (subtotal === 0) deliveryCharge = 40;
        let grandTotal = subtotal + deliveryCharge;
        return { subtotal, deliveryCharge, grandTotal };
    }

    function updateCartDisplay() {
        let cartContainer = document.getElementById('cart-items');
        let subtotalEl = document.getElementById('subtotal-price');
        let barTotalEl = document.getElementById('bar-total');
        let deliveryEl = document.getElementById('delivery-charge');
        let totalPriceEl = document.getElementById('total-price');
        let btnPayTotalEl = document.getElementById('btn-pay-total');
        let promoBannerEl = document.getElementById('promo-banner');
        
        let subtotal = 0;
        let html = '';

        for (let item in cart) {
            let qtyEl = document.getElementById(`qty-${item}`);
            if (cart[item] && cart[item].qty > 0) {
                let itemTotal = cart[item].qty * prices[item];
                subtotal += itemTotal;
                html += `${item} x ${cart[item].qty} (₹${itemTotal})<br>`;
                if (qtyEl) qtyEl.innerText = cart[item].qty;
            } else {
                if (qtyEl) qtyEl.innerText = 0;
            }
        }

        if (subtotal === 0) {
            cartContainer.innerHTML = 'No items selected.';
            subtotalEl.innerText = 0;
            barTotalEl.innerText = 0;
            deliveryEl.innerText = 40;
            totalPriceEl.innerText = 0;
            btnPayTotalEl.innerText = 0;
            promoBannerEl.innerHTML = '📦 Free Delivery on orders above ₹1,500!';
            return;
        }

        cartContainer.innerHTML = html;
        subtotalEl.innerText = subtotal;

        let deliveryCharge = (subtotal >= 1500) ? 0 : 40;
        let grandTotal = subtotal + deliveryCharge;
        
        deliveryEl.innerText = deliveryCharge;
        totalPriceEl.innerText = grandTotal;
        barTotalEl.innerText = grandTotal;
        btnPayTotalEl.innerText = grandTotal;

        if (subtotal >= 1500) {
            promoBannerEl.innerHTML = '🎉 Awesome! You unlocked FREE Delivery!';
        } else {
            let needed = 1500 - subtotal;
            promoBannerEl.innerHTML = `📦 Add ₹${needed} more for FREE Delivery!`;
        }
    }

    function sendOrderData(paymentType) {
        let phone = document.getElementById('customer-phone').value;
        let address = document.getElementById('customer-address').value;
        let totals = calculateTotals();
        
        let itemsList = "";
        for (let item in cart) {
            if (cart[item] && cart[item].qty > 0) {
                itemsList += `${item} x ${cart[item].qty}, `;
            }
        }

        let orderData = {
            phone: phone,
            address: address,
            items: itemsList,
            grandTotal: totals.grandTotal,
            paymentMethod: paymentType
        };

        if (SCRIPT_URL) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            }).catch(err => console.log('Sheet log error:', err));
        }
    }

    function payAndSendWhatsApp() {
        let phone = document.getElementById('customer-phone').value;
        let address = document.getElementById('customer-address').value;

        if (!phone) { alert('Please enter your phone number first.'); return; }
        if (!address) { alert('Please enter your delivery address first.'); return; }

        let totals = calculateTotals();
        if (totals.subtotal === 0) { alert('Please select at least one item first.'); return; }

        sendOrderData('Pre-Paid (UPI)');

        let message = "New Order - Yamja Fresh (Pre-Paid):\n\n";
        let subtotal = 0;

        for (let item in cart) {
            if (cart[item] && cart[item].qty > 0) {
                let itemTotal = cart[item].qty * prices[item];
                subtotal += itemTotal;
                message += `- ${item} x ${cart[item].qty} (₹${itemTotal})\n`;
            }
        }

        let deliveryCharge = (subtotal >= 1500) ? 0 : 40;
        let grandTotal = subtotal + deliveryCharge;

        message += `\nSubtotal: ₹${subtotal}\n`;
        message += `Delivery Charge: ₹${deliveryCharge} ${deliveryCharge === 0 ? '(FREE)' : ''}\n`;
        message += `Grand Total: ₹${grandTotal}\n\n`;
        message += `Customer Details:\nPhone: ${phone}\nAddress: ${address}\n\n`;
        message += `Payment: PhonePe / Google Pay / UPI (Paid via Tap-to-Pay)`;

        let upiUrl = `upi://pay?pa=${STORE_UPI_ID}&pn=Yamja%20Fresh&am=${totals.grandTotal}&cu=INR`;
        window.location.href = upiUrl;

        setTimeout(function() {
            let encodedMessage = encodeURIComponent(message);
            let whatsappUrl = `https://wa.me/9779806537609?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }, 1000);
    }

    function increment(item) {
        if (!cart[item]) { cart[item] = { qty: 0 }; }
        cart[item].qty++;
        updateCartDisplay();
    }

    function decrement(item) {
        if (cart[item] && cart[item].qty > 0) {
            cart[item].qty--;
            updateCartDisplay();
        }
    }

    function checkoutWhatsApp() {
        let phone = document.getElementById('customer-phone').value;
        let address = document.getElementById('customer-address').value;

        if (!phone) { alert('Please enter your phone number.'); return; }
        if (!address) { alert('Please enter your delivery address.'); return; }

        let hasItems = false;
        for (let item in cart) {
            if (cart[item] && cart[item].qty > 0) { hasItems = true; break; }
        }
        if (!hasItems) { alert('Please select at least one item.'); return; }

        sendOrderData('Cash on Delivery (COD)');

        let message = "New Order - Yamja Fresh (COD):\n\n";
        let subtotal = 0;

        for (let item in cart) {
            if (cart[item] && cart[item].qty > 0) {
                let itemTotal = cart[item].qty * prices[item];
                subtotal += itemTotal;
                message += `- ${item} x ${cart[item].qty} (₹${itemTotal})\n`;
            }
        }

        let deliveryCharge = (subtotal >= 1500) ? 0 : 40;
        let grandTotal = subtotal + deliveryCharge;

        message += `\nSubtotal: ₹${subtotal}\n`;
        message += `Delivery Charge: ₹${deliveryCharge} ${deliveryCharge === 0 ? '(FREE)' : ''}\n`;
        message += `Grand Total: ₹${grandTotal}\n\n`;
        message += `Customer Details:\nPhone: ${phone}\nAddress: ${address}\n\n`;
        message += `Payment: Cash on Delivery (COD)`;

        let encodedMessage = encodeURIComponent(message);
        let whatsappUrl = `https://wa.me/9779806537609?text=${encodedMessage}`;
        window.open(whatsappUrl, '_blank');
    }
</script>
