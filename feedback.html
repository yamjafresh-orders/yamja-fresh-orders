<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamja Fresh - Customer Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
            text-align: left;
        }
        select, textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button {
            width: 100%;
            background-color: #cc0000;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }
        button:hover {
            background-color: #990000;
        }
        #statusMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo image -->
    <img src="Untitled_Artwork.PNG" alt="Yamja Fresh Logo" class="logo">

    <!-- Hidden iframe handles submission silently to bypass CORS blocks -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { successMessage(); }"></iframe>

    <form id="feedbackForm" action="https://script.google.com/macros/s/AKfycbwMvjIsEFBXmTttwC8DhrBEcZC81MwYU6CQ6ox6A98Yf03Wn7JA0lSrxrYYvZhvdeOE/exec" method="POST" target="hidden_iframe">
        
        <!-- EXISTING FIELDS (Cols B - I) -->
        <label for="experience">Overall Experience:</label>
        <select id="experience" name="experience" required>
            <option value="" disabled selected>-- Select Experience --</option>
            <option value="Excellent">⭐ Excellent</option>
            <option value="Good">👍 Good</option>
            <option value="Needs Improvement">⚠️ Needs Improvement</option>
        </select>

        <label for="cleanliness">Cleanliness:</label>
        <select id="cleanliness" name="cleanliness" required>
            <option value="" disabled selected>-- Select Cleanliness --</option>
            <option value="Very Clean">✨ Very Clean</option>
            <option value="Clean">🧹 Clean</option>
            <option value="Needs Attention">⚠️ Needs Attention</option>
        </select>

        <label for="quality">Quality:</label>
        <select id="quality" name="quality" required>
            <option value="" disabled selected>-- Select Quality --</option>
            <option value="Premium">🥩 Premium</option>
            <option value="Good Quality">👍 Good Quality</option>
            <option value="Disappointing">❌ Disappointing</option>
        </select>

        <label for="pricing">Pricing:</label>
        <select id="pricing" name="pricing" required>
            <option value="" disabled selected>-- Select Pricing --</option>
            <option value="Fair & Affordable">💵 Fair & Affordable</option>
            <option value="Reasonable">🏷️ Reasonable</option>
            <option value="A Bit High">📈 A Bit High</option>
        </select>

        <label for="staff">Staff:</label>
        <select id="staff" name="staff" required>
            <option value="" disabled selected>-- Select Staff Rating --</option>
            <option value="Very Polite & Helpful">😊 Very Polite & Helpful</option>
            <option value="Polite">🤝 Polite</option>
            <option value="Unhelpful">⚠️ Unhelpful</option>
        </select>

        <label for="comments">Comments / Feedback:</label>
        <textarea id="comments" name="comments" placeholder="Tell us how we can improve..."></textarea>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number">

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter email address">

        <!-- NEW SURVEY FIELDS (Cols J - N) -->
        <label for="howHeard">How did you hear about Yamja Fresh?</label>
        <select id="howHeard" name="howHeard" required>
            <option value="" disabled selected>-- Select Option --</option>
            <option value="Friends & Family">👥 Friends & Family</option>
            <option value="Social Media">📱 Social Media (Facebook / Instagram)</option>
            <option value="Passed by Store">🏪 Passed by Store / Walk-in</option>
            <option value="Google Search">🔍 Google Search</option>
            <option value="QR Code / Flyer">📄 QR Code / Flyer</option>
        </select>

        <label for="purchaseFrequency">In a week or in a month, how many times do you buy meat from us?</label>
        <select id="purchaseFrequency" name="purchaseFrequency" required>
            <option value="" disabled selected>-- Select Purchase Frequency --</option>
            <option value="First Time">🆕 First Time Today</option>
            <option value="1-2 times a week">🥩 1-2 times a week</option>
            <option value="3-4 times a week">🥩 3-4 times a week</option>
            <option value="1-2 times a month">🥩 1-2 times a month</option>
            <option value="3-4 times a month">🥩 3-4 times a month</option>
            <option value="5+ times a month">🥩 5+ times a month</option>
        </select>

        <label for="onlineService">How is our online order service?</label>
        <select id="onlineService" name="onlineService" required>
            <option value="" disabled selected>-- Select Rating --</option>
            <option value="Excellent">⭐ Excellent & Fast</option>
            <option value="Good">👍 Good & Convenient</option>
            <option value="Needs Improvement">⚠️ Needs Improvement</option>
            <option value="Haven't Used Yet">🛒 Haven't used online order yet</option>
        </select>

        <label for="recommendation">Will you recommend Yamja Fresh to family & friends?</label>
        <select id="recommendation" name="recommendation" required>
            <option value="" disabled selected>-- Select Option --</option>
            <option value="Definitely Yes">💯 Definitely Yes</option>
            <option value="Maybe">👍 Maybe</option>
            <option value="No">❌ No</option>
        </select>

        <label for="customerName">Full Name:</label>
        <input type="text" id="customerName" name="customerName" placeholder="Enter full name">

        <button type="submit" id="submitBtn">Submit Feedback</button>
        <div id="statusMessage"></div>
    </form>
</div>

<script>
    let submitted = false;

    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', function() {
        submitted = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";
        statusMessage.style.color = "#333";
        statusMessage.textContent = "Sending feedback...";
    });

    function successMessage() {
        statusMessage.style.color = "green";
        statusMessage.textContent = "Thank you! Feedback submitted successfully.";
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Feedback";
        submitted = false;
    }
</script>

</body>
</html>
