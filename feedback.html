<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamja Fresh Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #555;
        }
        select, textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #d9534f;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #c9302c;
        }
        #response-msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Yamja Fresh Feedback</h2>
    <form id="feedbackForm">
        <label for="experience">Overall Experience:</label>
        <select id="experience" required>
            <option value="">Select...</option>
            <option value="Excellent">⭐ Excellent</option>
            <option value="Good">👍 Good</option>
            <option value="Average">😐 Average</option>
            <option value="Needs Improvement">⚠️ Needs Improvement</option>
        </select>

        <label for="cleanliness">Cleanliness:</label>
        <select id="cleanliness" required>
            <option value="">Select...</option>
            <option value="Spotless">✨ Spotless</option>
            <option value="Good">👍 Good</option>
            <option value="Needs Attention">🧹 Needs Attention</option>
        </select>

        <label for="quality">Quality:</label>
        <select id="quality" required>
            <option value="">Select...</option>
            <option value="Fresh & High Quality">🥩 Fresh & High Quality</option>
            <option value="Average">😐 Average</option>
            <option value="Disappointing">❌ Disappointing</option>
        </select>

        <label for="pricing">Pricing:</label>
        <select id="pricing" required>
            <option value="">Select...</option>
            <option value="Fair & Reasonable">💵 Fair & Reasonable</option>
            <option value="A Bit High">📈 A Bit High</option>
            <option value="Too Expensive">💸 Too Expensive</option>
        </select>

        <label for="staff">Staff:</label>
        <select id="staff" required>
            <option value="">Select...</option>
            <option value="Very Polite & Helpful">😊 Very Polite & Helpful</option>
            <option value="Average">😐 Average</option>
            <option value="Unhelpful">❌ Unhelpful</option>
        </select>

        <label for="comments">Comments / Feedback:</label>
        <textarea id="comments" rows="3" placeholder="Tell us how we can improve..."></textarea>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" placeholder="Enter your phone number">

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email address">

        <button type="submit" id="submitBtn">Submit Feedback</button>
    </form>
    <div id="response-msg"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwMvjIsEFBXmTttwC8DhrBEcZC81MwYU6CQ6ox6A98Yf03Wn7JA0lSrxrYYvZhvdeOE/exec';
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const responseMsg = document.getElementById('response-msg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';
        responseMsg.textContent = '';

        const formData = {
            experience: document.getElementById('experience').value,
            cleanliness: document.getElementById('cleanliness').value,
            quality: document.getElementById('quality').value,
            pricing: document.getElementById('pricing').value,
            staff: document.getElementById('staff').value,
            comments: document.getElementById('comments').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value
        };

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(formData),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            mode: 'no-cors'
        })
        .then(() => {
            responseMsg.style.color = 'green';
            responseMsg.textContent = 'Thank you! Your feedback has been recorded.';
            form.reset();
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Feedback';
        })
        .catch(error => {
            console.error('Error!', error);
            responseMsg.style.color = 'red';
            responseMsg.textContent = 'Submission failed. Please try again.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Feedback';
        });
    });
</script>

</body>
</html>
