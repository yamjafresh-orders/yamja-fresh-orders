<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamja Fresh - Rider Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c5e1a; margin-top: 0; }
        .refresh-btn { background-color: #2c5e1a; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 20px; }
        .refresh-btn:hover { background-color: #1e3f11; }
        
        .order-card { background: #ffffff; border: 1px solid #cbd5e0; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 6px; margin-bottom: 8px; }
        .order-header h4 { margin: 0; color: #2c5e1a; font-size: 16px; }
        .copy-btn { background: #edf2f7; border: 1px solid #cbd5e0; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .copy-btn:hover { background: #e2e8f0; }

        .order-detail { font-size: 14px; margin-bottom: 6px; color: #4a5568; }
        .status-text { font-weight: bold; color: #d69e2e; margin: 10px 0; }
        
        .action-buttons { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .action-buttons button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: white; }
        .btn-dispatch { background-color: #dd6b20; }
        .btn-out { background-color: #3182ce; }
        .btn-delivered { background-color: #38a169; }
        .btn-delete { background-color: #e53e3e; flex: 0.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚴 Yamja Fresh Rider Dashboard</h2>
    <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh Orders</button>
    <div id="orders-list">Loading orders...</div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxs3pi2MbK6sd-LXF2CmP18qR4Dvqoi3cTaL_GGko-T49VCYvRf13AfTOhgpS2zyGaplA/exec";

    window.onload = function() {
        loadOrders();
        // Auto-refresh every 10 seconds to catch live orders
        setInterval(loadOrders, 10000);
    };

    function loadOrders() {
        let listEl = document.getElementById('orders-list');

        fetch(APPS_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                if (!data || data.length === 0) {
                    listEl.innerHTML = "<p style='text-align:center; color:#718096;'>No active orders found.</p>";
                    return;
                }

                let html = '';
                data.forEach(order => {
                    html += `
                        <div class="order-card">
                            <div class="order-header">
                                <h4>Tracking ID: ${order.trackingId}</h4>
                                <button class="copy-btn" onclick="copyId('${order.trackingId}')">📋 Copy ID</button>
                            </div>
                            <div class="order-detail"><strong>Phone:</strong> <a href="tel:${order.phone}">${order.phone}</a></div>
                            <div class="order-detail"><strong>Address:</strong> ${order.address}</div>
                            <div class="order-detail"><strong>Items:</strong> ${order.items}</div>
                            <div class="order-detail"><strong>Total:</strong> ₹${order.grandTotal} (${order.paymentMethod})</div>
                            <div class="status-text">Current Status: ${order.status}</div>
                            <div class="action-buttons">
                                <button class="btn-dispatch" onclick="updateStatus('${order.trackingId}', 'Rider dispatched and picking up order.')">Dispatch</button>
                                <button class="btn-out" onclick="updateStatus('${order.trackingId}', 'Out for Delivery')">Out for Delivery</button>
                                <button class="btn-delivered" onclick="updateStatus('${order.trackingId}', 'Delivered Successfully')">Delivered</button>
                                <button class="btn-delete" onclick="deleteOrder('${order.trackingId}')">🗑️ Clear</button>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;
            })
            .catch(err => {
                listEl.innerHTML = "<p style='color: red;'>Error loading orders. Check connection.</p>";
                console.error(err);
            });
    }

    function copyId(trackingId) {
        navigator.clipboard.writeText(trackingId).then(() => {
            alert('Copied Tracking ID: ' + trackingId);
        });
    }

    function updateStatus(trackingId, newStatus) {
        let payload = { action: "updateStatus", trackingId: trackingId, status: newStatus };
        
        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert('Status updated to: ' + newStatus);
            setTimeout(loadOrders, 800);
        }).catch(err => alert('Error updating status'));
    }

    function deleteOrder(trackingId) {
        if (!confirm('Are you sure you want to remove order ' + trackingId + ' from the active list?')) return;

        let payload = { action: "deleteOrder", trackingId: trackingId };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert('Order cleared.');
            setTimeout(loadOrders, 800);
        }).catch(err => alert('Error deleting order'));
    }
</script>

</body>
</html>
