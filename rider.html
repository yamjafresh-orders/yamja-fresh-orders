<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamja Fresh - Rider Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c5e1a; margin-top: 0; }
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .input-group input { flex: 1; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; }
        .input-group button { background-color: #2c5e1a; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .order-card { background: #ffffff; border: 1px solid #cbd5e0; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 6px; margin-bottom: 8px; }
        .order-header h4 { margin: 0; color: #2c5e1a; font-size: 16px; }
        .order-detail { font-size: 14px; margin-bottom: 6px; color: #4a5568; }
        .status-text { font-weight: bold; color: #d69e2e; margin: 10px 0; }
        .action-buttons { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .action-buttons button, .action-buttons a { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: white; text-align: center; text-decoration: none; }
        .btn-dispatch { background-color: #dd6b20; }
        .btn-out { background-color: #3182ce; }
        .btn-delivered { background-color: #38a169; }
        .btn-gps { background-color: #2b6cb0; display: block; width: 100%; margin-top: 8px; padding: 10px; background: #319795; color: white; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .btn-delete { background-color: #e53e3e; flex: 0.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚴 Yamja Fresh Rider Dashboard</h2>
    <div class="input-group">
        <input type="text" id="trackingInput" placeholder="Enter Tracking ID (e.g., YFJ-1001)">
        <button onclick="fetchAndAddOrder()">Add Order</button>
    </div>
    <div id="orders-container">
        <div style="text-align: center; color: #718096;" id="no-orders-msg">No active orders added yet. Enter a tracking ID above.</div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxs3pi2MbK6sd-LXF2CmP18qR4Dvqoi3cTaL_GGko-T49VCYvRf13AfTOhgpS2zyGaplA/exec';

    window.onload = function() { loadSavedOrders(); };

    function loadSavedOrders() {
        let saved = JSON.parse(localStorage.getItem('rider_orders') || '[]');
        let container = document.getElementById('orders-container');
        if (saved.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #718096;" id="no-orders-msg">No active orders added yet. Enter a tracking ID above.</div>';
            return;
        }
        let html = '';
        saved.forEach(order => {
            let mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}`;
            html += `
                <div class="order-card" id="card-${order.trackingId}">
                    <div class="order-header">
                        <h4>Tracking ID: ${order.trackingId}</h4>
                    </div>
                    <div class="order-detail"><strong>Phone:</strong> ${order.phone}</div>
                    <div class="order-detail"><strong>Address:</strong> ${order.address}</div>
                    <a href="${mapsUrl}" target="_blank" class="btn-gps">🗺️ Open GPS Navigation to Address</a>
                    <div class="order-detail" style="margin-top: 8px;"><strong>Items:</strong> ${order.items}</div>
                    <div class="order-detail"><strong>Total:</strong> ₹${order.grandTotal} (${order.paymentMethod})</div>
                    <div class="status-text" id="status-${order.trackingId}">Current Status: ${order.status}</div>
                    <div class="action-buttons">
                        <button class="btn-dispatch" onclick="updateStatus('${order.trackingId}', 'Rider dispatched and picking up order.')">Dispatch</button>
                        <button class="btn-out" onclick="updateStatus('${order.trackingId}', 'Out for Delivery')">Out for Delivery</button>
                        <button class="btn-delivered" onclick="updateStatus('${order.trackingId}', 'Delivered Successfully')">Delivered</button>
                        <button class="btn-delete" onclick="removeOrder('${order.trackingId}')">🗑️ Clear</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function fetchAndAddOrder() {
        let trackingId = document.getElementById('trackingInput').value.trim();
        if (!trackingId) { alert('Please enter a valid Tracking ID'); return; }

        fetch(SCRIPT_URL + "?trackingId=" + trackingId)
            .then(res => res.json())
            .then(data => {
                if (!data.phone) {
                    alert('Order ID not found in Google Sheets!');
                    return;
                }
                let saved = JSON.parse(localStorage.getItem('rider_orders') || '[]');
                if (!saved.some(o => o.trackingId === trackingId)) {
                    saved.push(data);
                    localStorage.setItem('rider_orders', JSON.stringify(saved));
                }
                document.getElementById('trackingInput').value = '';
                loadSavedOrders();
            })
            .catch(err => {
                alert('Error fetching order details from sheet.');
            });
    }

    function updateStatus(trackingId, newStatus) {
        document.getElementById('status-' + trackingId).innerText = "Current Status: " + newStatus;
        let payload = { action: "updateStatus", trackingId: trackingId, status: newStatus };
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert('Status updated successfully!');
        });
    }

    function removeOrder(trackingId) {
        let saved = JSON.parse(localStorage.getItem('rider_orders') || '[]');
        saved = saved.filter(o => o.trackingId !== trackingId);
        localStorage.setItem('rider_orders', JSON.stringify(saved));
        loadSavedOrders();
    }
</script>

</body>
</html>
