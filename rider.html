<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamja Fresh - Rider Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c5e1a; margin-top: 0; }
        .refresh-box { text-align: center; margin-bottom: 20px; }
        .refresh-box button { background-color: #3182ce; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .order-card { background: #ffffff; border: 1px solid #cbd5e0; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 6px; margin-bottom: 8px; }
        .order-header h4 { margin: 0; color: #2c5e1a; font-size: 16px; }
        .order-detail { font-size: 14px; margin-bottom: 6px; color: #4a5568; }
        .status-text { font-weight: bold; color: #d69e2e; margin: 10px 0; }
        .action-buttons { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .action-buttons button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: white; }
        .btn-dispatch { background-color: #dd6b20; }
        .btn-out { background-color: #3182ce; }
        .btn-delivered { background-color: #38a169; }
        .btn-gps { background-color: #805ad5; display: inline-block; padding: 4px 8px; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚴 Yamja Fresh Rider Dashboard</h2>
    <div class="refresh-box">
        <button onclick="fetchOrdersFromCloud()">🔄 Refresh Orders from Cloud</button>
    </div>
    <div id="orders-container">
        <div style="text-align: center; color: #718096;" id="loading-msg">Loading active orders...</div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxs3pi2MbK6sd-LXF2CmP18qR4Dvqoi3cTaL_GGko-T49VCYvRf13AfTOhgpS2zyGaplA/exec';

    window.onload = function() {
        fetchOrdersFromCloud();
    };

    function fetchOrdersFromCloud() {
        const container = document.getElementById('orders-container');
        container.innerHTML = '<div style="text-align: center; color: #718096;">Fetching live orders...</div>';

        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #718096;">No active orders found in cloud.</div>';
                    return;
                }

                let html = '';
                data.forEach(order => {
                    let mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}`;
                    html += `
                        <div class="order-card" id="card-${order.trackingId}">
                            <div class="order-header">
                                <h4>Tracking ID: ${order.trackingId}</h4>
                            </div>
                            <div class="order-detail"><strong>Phone:</strong> <a href="tel:${order.phone}">${order.phone}</a></div>
                            <div class="order-detail">
                                <strong>Address:</strong> ${order.address} 
                                <a href="${mapsUrl}" target="_blank" class="btn-gps">🗺️ GPS Directions</a>
                            </div>
                            <div class="order-detail"><strong>Items:</strong> ${order.items}</div>
                            <div class="order-detail"><strong>Total:</strong> ₹${order.grandTotal} (${order.paymentMethod})</div>
                            <div class="status-text" id="status-${order.trackingId}">Current Status: ${order.status}</div>
                            <div class="action-buttons">
                                <button class="btn-dispatch" onclick="updateStatus('${order.trackingId}', 'Rider Dispatched')">Dispatch</button>
                                <button class="btn-out" onclick="updateStatus('${order.trackingId}', 'Out for Delivery')">Out for Delivery</button>
                                <button class="btn-delivered" onclick="updateStatus('${order.trackingId}', 'Delivered Successfully')">Delivered</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = '<div style="text-align: center; color: #e53e3e;">Failed to load orders from cloud. Check connection.</div>';
            });
    }

    function updateStatus(trackingId, newStatus) {
        document.getElementById('status-' + trackingId).innerText = "Current Status: " + newStatus;
        
        let payload = { action: "updateStatus", trackingId: trackingId, status: newStatus };
        
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert(`Order ${trackingId} updated to: ${newStatus}`);
            // If delivered, refresh the list so it automatically vanishes from the rider screen
            if (newStatus.includes('Delivered')) {
                setTimeout(fetchOrdersFromCloud, 1000);
            }
        }).catch(err => {
            console.error('Error updating status:', err);
        });
    }
</script>

</body>
</html>
